name: Validar Rama Origen

on:
  pull_request:
    branches:
      - master

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validar si el origen es dev
        if: github.base_ref == 'master' && github.head_ref != 'dev'
        run: |
          echo "Error: Solo se permiten Merges a 'master' que provengan de 'dev'."
          exit 1
