security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Loads users from the database (via the Identity UserRepository port) by the JWT "sub" claim.
        identity_users:
            id: App\Identity\Infrastructure\Security\SecurityUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # No session anywhere: the security token is rebuilt from the JWT on every request.
        api:
            # Token in "Authorization: Bearer"; failures answer a JSON 401.
            pattern: ^/api/
            lazy: true
            stateless: true
            provider: identity_users
            jwt: ~
        main:
            # Token in the HttpOnly BEARER cookie set by /login; failures redirect to /login.
            lazy: true
            stateless: true
            provider: identity_users
            jwt: ~
            entry_point: App\Identity\Infrastructure\Security\WebLoginEntryPoint
            # POST /logout with a stateless CSRF token. Lexik blocklists the JWT and
            # ClearAccessTokenCookieOnLogout deletes the BEARER cookie.
            logout:
                path: /logout
                target: identity_login
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # Public endpoints must be declared above the catch-all rules (e.g. ^/api/v1/login).
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # /user answers anonymous visitors with a 401 page itself instead of redirecting them to /login.
        - { path: ^/user$, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED }
        - { path: ^/, roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
